name: build
on:
  push:
    branches: [main]
  workflow_dispatch:

# 결과물은 GitHub Release 에 올린다 (Actions 아티팩트 저장 용량은 계정 공용이라 차면 업로드가 실패함).
# 아티팩트도 함께 올리되 3일만 보관해 용량이 다시 차지 않게 한다.
permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt pyinstaller
      - name: Tesseract 다운로드 (한국어 포함)
        shell: pwsh
        run: |
          choco install tesseract -y --no-progress
          $t = "C:\Program Files\Tesseract-OCR"
          New-Item -ItemType Directory -Force tesseract\tessdata | Out-Null
          Copy-Item "$t\*.dll" tesseract\
          Copy-Item "$t\tesseract.exe" tesseract\
          Invoke-WebRequest https://github.com/tesseract-ocr/tessdata_fast/raw/main/kor.traineddata -OutFile tesseract\tessdata\kor.traineddata
          Invoke-WebRequest https://github.com/tesseract-ocr/tessdata_fast/raw/main/eng.traineddata -OutFile tesseract\tessdata\eng.traineddata
      - run: pyinstaller --noconfirm --windowed --onefile --name "PDF개인정보삭제기" --add-data "tesseract;tesseract" --add-data "ui;ui" --collect-all webview --collect-all clr_loader --collect-all pythonnet --hidden-import webview.platforms.winforms --hidden-import webview.platforms.edgechromium app_web.py
      - uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: PDF개인정보삭제기-windows
          path: dist/PDF개인정보삭제기.exe
          retention-days: 3
      - name: Release 에 올리기
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: "빌드 #${{ github.run_number }} (${{ github.ref_name }})"
          body: "브랜치 ${{ github.ref_name }} · 커밋 ${{ github.sha }}"
          prerelease: ${{ github.ref_name != 'main' }}
          files: dist/PDF개인정보삭제기.exe

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt pyinstaller
      - run: pyinstaller --noconfirm --windowed --name "PDF개인정보삭제기" --add-data "ui:ui" --collect-all webview --hidden-import webview.platforms.cocoa app_web.py
      - run: cd dist && zip -r "PDF개인정보삭제기-mac.zip" "PDF개인정보삭제기.app"
      - uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: PDF개인정보삭제기-mac
          path: dist/PDF개인정보삭제기-mac.zip
          retention-days: 3
      - name: Release 에 올리기
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: "빌드 #${{ github.run_number }} (${{ github.ref_name }})"
          body: "브랜치 ${{ github.ref_name }} · 커밋 ${{ github.sha }}"
          prerelease: ${{ github.ref_name != 'main' }}
          files: dist/PDF개인정보삭제기-mac.zip
